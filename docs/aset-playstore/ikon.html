<!doctype html><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  html,body { width:512px; height:512px; overflow:hidden }
  body {
    background:
      radial-gradient(120% 100% at 50% 0%, #14245c 0%, #0a1440 45%, #050c28 100%);
    display:grid; place-items:center;
  }
  /* Kisi halus, meneruskan bahasa visual situs dan aplikasi. */
  .kisi {
    position:absolute; inset:0;
    background-image:
      linear-gradient(#ffffff0d 1px, transparent 1px),
      linear-gradient(90deg, #ffffff0d 1px, transparent 1px);
    background-size:40px 40px;
  }
  img { position:relative; width:352px; height:auto; display:block;
        filter: drop-shadow(0 10px 26px #00000066) }
</style>
<div class="kisi"></div>
<img src="logo.png" alt="">
