<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box }
  html, body { width: 1024px; height: 500px; overflow: hidden }

  body {
    background:
      radial-gradient(90% 140% at 18% 0%, #16295f 0%, #0a1440 42%, #050c28 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    position: relative;
  }

  /* Kisi halus — bahasa visual yang sama dengan situs dan dasbor. */
  .kisi {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#ffffff0a 1px, transparent 1px),
      linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
    background-size: 44px 44px;
  }

  /* Sapuan cahaya emas di belakang lambang. */
  .cahaya {
    position: absolute; right: -60px; top: 50%; transform: translateY(-50%);
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, #f5b30126 0%, transparent 62%);
  }

  .isi {
    position: relative; height: 100%;
    display: grid; grid-template-columns: 1fr auto;
    align-items: center; gap: 40px;
    padding: 0 68px 0 76px;
  }

  .pita {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 7px 15px; border-radius: 999px;
    border: 1px solid #f5b30159; background: #f5b3011a;
    font-size: 14.5px; font-weight: 700; letter-spacing: .13em;
    text-transform: uppercase; color: #fcd34d;
  }
  .pita span.titik {
    width: 7px; height: 7px; border-radius: 50%; background: #f5b301;
    box-shadow: 0 0 0 4px #f5b30133;
  }

  h1 {
    margin-top: 22px;
    font-size: 62px; font-weight: 800; line-height: 1.02;
    letter-spacing: -.02em;
  }
  h1 em { font-style: normal; color: #f5b301 }

  p.sub {
    margin-top: 18px; max-width: 542px;
    font-size: 20.5px; line-height: 1.45; color: #c3cbe4;
  }

  ul {
    margin-top: 26px; display: flex; gap: 9px; list-style: none;
  }
  li {
    padding: 7px 12px; border-radius: 10px;
    border: 1px solid #ffffff1f; background: #ffffff0d;
    font-size: 14px; font-weight: 600; color: #dbe3ff; white-space: nowrap;
  }

  .lambang { position: relative; display: grid; place-items: center }
  .lambang img { width: 262px; height: auto; filter: drop-shadow(0 18px 40px #00000073) }
</style>

<div class="kisi"></div>
<div class="cahaya"></div>

<div class="isi">
  <div>
    <div class="pita"><span class="titik"></span> Aplikasi Lapangan</div>
    <h1>DHARMAPATI</h1>
    <p class="sub">Presensi di pos, ronde patroli yang terbukti dijalankan, dan laporan jaga yang rapi — dari satu ponsel.</p>
    <ul>
      <li>Presensi berfoto</li>
      <li>Ronde QR/NFC</li>
      <li>Tombol darurat</li>
      <li>Tanpa sinyal</li>
    </ul>
  </div>
  <div class="lambang"><img src="logo.png" alt=""></div>
</div>
