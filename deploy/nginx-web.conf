server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;
  gzip on;

  # Header keamanan untuk halaman aplikasi. Helmet sudah memasangnya pada
  # jawaban /api, tetapi berkas HTML dan aset dilayani nginx sehingga harus
  # diatur di sini juga — tanpa ini dasbor dapat dibingkai situs lain.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
  # Peta memakai ubin OpenStreetMap dan huruf dari Google Fonts; selebihnya
  # hanya berkas milik sendiri.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self'; connect-src 'self' wss: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API
  location /api/ {
    proxy_pass http://backend:5027;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Kanal realtime
  location /socket.io/ {
    proxy_pass http://backend:5027;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Berkas media di MinIO. Nama objeknya acak 96 bit sehingga tidak dapat
  # ditebak, tetapi tautannya sendiri tidak meminta login — jangan dibagikan
  # ke luar. Mesin pencari dilarang mengindeksnya.
  location /storage/ {
    proxy_pass http://minio:9000/patroli/;
    proxy_set_header Host $host;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires 7d;
    add_header Cache-Control "private, max-age=604800" always;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
